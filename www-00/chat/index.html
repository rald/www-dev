<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pantasya Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header-area">
        <h2>Pantasya Chat</h2>
        <div class="header-controls">
            <!-- Dynamic Date Navigator Selection Filter Dropdown Component -->
            <select id="dateFilter" class="date-select" aria-label="Select Chat Day Target"></select>
            <button id="themeToggle" class="theme-btn" aria-label="Toggle theme">☀️</button>
        </div>
    </div>

    <div class="chat-container">
        <div id="chatbox"></div>
        
        <div class="input-group">
            <div class="inputs-row">
				<!-- Inside <div class="inputs-row"> -->
				<input type="text" id="username" name="user" placeholder="User" value="Anonymous" maxlength="32">
				<input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off" maxlength="512">            </div>
            <button id="sendBtn">Send Message</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
