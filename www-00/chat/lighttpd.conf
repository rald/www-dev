server.modules += ( "mod_cgi", "mod_alias" )

server.document-root = "/home/fria/projects/ccgichat/"
server.port = 14344

dir-listing.activate = "enable"

index-file.names = ( "index.html", "index.cgi" )

mimetype.assign = (
  ".html" => "text/html",
  ".js"   => "application/javascript",
  ".css"  => "text/css"
)

# Route chat requests to the compiled CGI binary
alias.url = ( "/api/chat" => "/home/fria/projects/ccgichat/cgi-bin/chat.cgi" )
$HTTP["url"] =~ "^/api/" {
    cgi.assign = ( "" => "" ) # Execute directly as it's a binary
}
